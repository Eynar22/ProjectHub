version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: buscador_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: buscador
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data:/docker-entrypoint-initdb.d
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buscador_backend
    restart: always
    environment:
      - CORS_ORIGINS=https://projecthub.umaunivalle.com,http://localhost:5173
      - DATABASE_URL=postgresql://postgres:12345@postgres:5432/buscador
      - JWT_SECRET=super_secret_key_123
      - PORT=3000
      # Explícito por las mismas columnas timestamp-sin-zona (ver backend/.env);
      # la imagen node:20-alpine ya usa UTC por defecto, esto lo deja documentado.
      - TZ=UTC
      # Almacenamiento de archivos en disco (imágenes / PDF). Ver backend/.env.example.
      - ALMACENAMIENTO_DIR=/app/almacenamiento
      # Tope de uso: 55 GiB (~28% de los 192 GB del host, deja margen sobre el 30%).
      - ALMACENAMIENTO_MAX_BYTES=59055800320
    ports:
      - "3010:3000"
    volumes:
      # Volumen con nombre (igual que postgres_data): lo administra Docker, no
      # depende de en qué carpeta del host haya quedado el checkout del compose
      # en este deploy. Un bind mount a ruta relativa (../files/...) se rompía
      # entre deploys de Dokploy porque esa ruta se resuelve contra el working
      # dir del compose, que no es estable de un deploy a otro.
      - almacenamiento_data:/app/almacenamiento
    depends_on:
      - postgres
    networks:
      - app-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buscador_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  postgres_data:
  almacenamiento_data:

networks:
  app-network:
    driver: bridge